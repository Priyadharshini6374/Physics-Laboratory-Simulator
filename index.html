<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Physics Laboratory Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <h1>Physics Laboratory Simulator</h1>

        <p>Interactive Physics Experiments</p>

    </header>


    <!-- =====================================================
         MAIN APPLICATION
    ====================================================== -->

    <main>


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <h2>Experiments</h2>


            <button
                type="button"
                class="experiment-btn"
                data-experiment="projectile"
                onclick="selectExperiment('projectile')">

                Projectile Motion

            </button>


            <button
                type="button"
                class="experiment-btn"
                data-experiment="pendulum"
                onclick="selectExperiment('pendulum')">

                Pendulum

            </button>


            <button
                type="button"
                class="experiment-btn"
                data-experiment="collision"
                onclick="selectExperiment('collision')">

                Collision

            </button>


            <button
                type="button"
                class="experiment-btn"
                data-experiment="friction"
                onclick="selectExperiment('friction')">

                Friction

            </button>


            <button
                type="button"
                class="experiment-btn"
                data-experiment="spring"
                onclick="selectExperiment('spring')">

                Spring &amp; Mass

            </button>


            <button
                type="button"
                class="experiment-btn"
                data-experiment="freefall"
                onclick="selectExperiment('freefall')">

                Free Fall

            </button>

        </aside>



        <!-- =================================================
             MAIN SIMULATION SECTION
        ================================================== -->

        <section class="simulation-section">


            <!-- =============================================
                 EXPERIMENT TITLE
            ============================================== -->

            <div class="experiment-title">

                <h2 id="experimentTitle">
                    Projectile Motion
                </h2>

                <p id="experimentDescription">
                    Simulate the motion of a projectile.
                </p>

            </div>



            <!-- =============================================
                 LEFT VISUAL AREA
            ============================================== -->

            <div class="visual-area">


                <!-- SIMULATION -->

                <div class="canvas-container">

                    <canvas
                        id="simulationCanvas"
                        width="800"
                        height="450">
                    </canvas>

                </div>



                <!-- GRAPH -->

                <div class="graph-container">

                    <h2 id="graphTitle">
                        Projectile Velocity vs Time
                    </h2>

                    <canvas
                        id="graphCanvas"
                        width="800"
                        height="300">
                    </canvas>

                </div>


            </div>



            <!-- =============================================
                 RIGHT CONTROL PANEL
            ============================================== -->

            <div class="controls">


                <h2>Parameters</h2>


                <!-- PROJECTILE -->

                <div class="parameter">

                    <label for="velocity">
                        Initial Velocity (m/s)
                    </label>

                    <input
                        type="number"
                        id="velocity"
                        value="20"
                        min="1"
                        max="100"
                        step="0.1">

                </div>


                <div class="parameter">

                    <label for="angle">
                        Launch Angle (degrees)
                    </label>

                    <input
                        type="number"
                        id="angle"
                        value="45"
                        min="0"
                        max="90"
                        step="1">

                </div>


                <!-- GRAVITY -->

                <div class="parameter">

                    <label for="gravity">
                        Gravity (m/s²)
                    </label>

                    <input
                        type="number"
                        id="gravity"
                        value="9.81"
                        min="0"
                        max="30"
                        step="0.01">

                </div>


                <!-- FREE FALL -->

                <div class="parameter">

                    <label for="height">
                        Height (m)
                    </label>

                    <input
                        type="number"
                        id="height"
                        value="50"
                        min="1"
                        max="500"
                        step="1">

                </div>


                <!-- PENDULUM -->

                <div class="parameter">

                    <label for="pendulumLength">
                        Pendulum Length (m)
                    </label>

                    <input
                        type="number"
                        id="pendulumLength"
                        value="2"
                        min="0.5"
                        max="10"
                        step="0.1">

                </div>


                <div class="parameter">

                    <label for="pendulumAngle">
                        Initial Angle (°)
                    </label>

                    <input
                        type="number"
                        id="pendulumAngle"
                        value="30"
                        min="1"
                        max="80"
                        step="1">

                </div>


                <!-- COLLISION -->

                <div class="parameter">

                    <label for="mass1">
                        Mass 1 (kg)
                    </label>

                    <input
                        type="number"
                        id="mass1"
                        value="2"
                        min="0.1"
                        step="0.1">

                </div>


                <div class="parameter">

                    <label for="mass2">
                        Mass 2 (kg)
                    </label>

                    <input
                        type="number"
                        id="mass2"
                        value="2"
                        min="0.1"
                        step="0.1">

                </div>


                <div class="parameter">

                    <label for="velocity1">
                        Velocity 1 (m/s)
                    </label>

                    <input
                        type="number"
                        id="velocity1"
                        value="5"
                        step="0.1">

                </div>


                <div class="parameter">

                    <label for="velocity2">
                        Velocity 2 (m/s)
                    </label>

                    <input
                        type="number"
                        id="velocity2"
                        value="-3"
                        step="0.1">

                </div>


                <!-- FRICTION -->

                <div class="parameter">

                    <label for="frictionMass">
                        Mass (kg)
                    </label>

                    <input
                        type="number"
                        id="frictionMass"
                        value="5"
                        min="0.1"
                        step="0.1">

                </div>


                <div class="parameter">

                    <label for="frictionVelocity">
                        Initial Velocity (m/s)
                    </label>

                    <input
                        type="number"
                        id="frictionVelocity"
                        value="10"
                        min="0"
                        step="0.1">

                </div>


                <div class="parameter">

                    <label for="frictionCoefficient">
                        Friction Coefficient (μ)
                    </label>

                    <input
                        type="number"
                        id="frictionCoefficient"
                        value="0.3"
                        min="0"
                        max="2"
                        step="0.05">

                </div>


                <!-- SPRING -->

                <div class="parameter">

                    <label for="springMass">
                        Mass (kg)
                    </label>

                    <input
                        type="number"
                        id="springMass"
                        value="2"
                        min="0.1"
                        step="0.1">

                </div>


                <div class="parameter">

                    <label for="springConstant">
                        Spring Constant (N/m)
                    </label>

                    <input
                        type="number"
                        id="springConstant"
                        value="20"
                        min="0.1"
                        step="0.1">

                </div>


                <div class="parameter">

                    <label for="springDisplacement">
                        Initial Displacement (m)
                    </label>

                    <input
                        type="number"
                        id="springDisplacement"
                        value="0.5"
                        min="0"
                        step="0.05">

                </div>



                <!-- =========================================
                     EXPERIMENT INFORMATION
                ========================================== -->

                <div
                    id="experimentInfo"
                    class="experiment-info">
                </div>



                <!-- =========================================
                     RESULTS
                ========================================== -->

                <div
                    id="resultsPanel"
                    class="results-panel">
                </div>



                <!-- =========================================
                     BUTTONS
                ========================================== -->

                <div class="buttons">

                    <button
                        type="button"
                        onclick="startSimulation()">

                        ▶ Start

                    </button>


                    <button
                        type="button"
                        onclick="pauseSimulation()">

                        ⏸ Pause

                    </button>


                    <button
                        type="button"
                        onclick="resetSimulation()">

                        ↻ Reset

                    </button>

                </div>


            </div>


        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
